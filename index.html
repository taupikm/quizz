<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Soal</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- MathJax untuk render rumus -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    
    <!-- CKEditor 5 (Classic) dengan Plugin Math -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/translations/id.js"></script>

</head>
<body>
    <!-- ... kode lain ... -->

    <!-- MODAL TAMBAH SOAL -->
    <div id="addQuestionModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Tambah Soal Baru</h2>
            <form id="addQuestionForm">
                <div class="form-group">
                    <label>Pertanyaan:</label>
                    <!-- Textarea yang akan diubah menjadi editor -->
                    <textarea id="questionEditor" name="question"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Opsi Jawaban (pisahkan dengan koma):</label>
                    <input type="text" id="optionsInput" placeholder="opsi1, opsi2, opsi3, opsi4">
                </div>
                
                <div class="form-group">
                    <label>Jawaban Benar:</label>
                    <input type="text" id="correctAnswerInput">
                </div>
                
                <div class="form-group">
                    <label>Kategori:</label>
                    <select id="categoryInput">
                        <option value="matematika">Matematika</option>
                        <option value="fisika">Fisika</option>
                        <option value="kimia">Kimia</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>URL Gambar (opsional):</label>
                    <input type="text" id="imageUrlInput" placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label>Rumus LaTeX (opsional):</label>
                    <input type="text" id="latexInput" placeholder="x^2 + 2x + 1 = 0">
                </div>
                
                <div class="form-group">
                    <label>Upload Gambar:</label>
                    <input type="file" id="imageUpload" accept="image/*">
                    <div id="imagePreview"></div>
                </div>
                
                <button type="submit" class="btn-primary">Simpan Soal</button>
            </form>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
